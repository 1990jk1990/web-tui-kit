name: Accessibility semantics regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  semantics:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser-test dependencies
        run: pip install -r requirements-visual.txt
      - name: Install pinned browser
        run: python -m playwright install --with-deps "${{ matrix.engine }}"
      - name: Verify accessibility semantics
        run: python scripts/accessibility_regression.py --engine "${{ matrix.engine }}"
      - name: Upload accessibility failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-regression-${{ matrix.engine }}-failures
          path: test-results/accessibility/
          if-no-files-found: warn
          retention-days: 14
