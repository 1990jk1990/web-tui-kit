name: Visual regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install visual-test dependencies
        run: pip install -r requirements-visual.txt
      - name: Install pinned Chromium
        run: python -m playwright install --with-deps chromium
      - name: Bootstrap reviewed baselines
        run: python scripts/visual_regression.py --update
      - name: Upload generated baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/visual/baselines/*.png
          if-no-files-found: error
