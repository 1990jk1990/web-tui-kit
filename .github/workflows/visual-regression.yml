name: Visual regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install visual-test dependencies
        run: pip install -r requirements-visual.txt
      - name: Install pinned Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify visual baselines
        run: python scripts/visual_regression.py
      - name: Upload visual regression failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-failures
          path: test-results/visual/
          if-no-files-found: warn
          retention-days: 14
