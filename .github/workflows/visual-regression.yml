name: Visual regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install visual-test dependencies
        run: pip install -r requirements-visual.txt
      - name: Install pinned Chromium
        run: python -m playwright install --with-deps chromium
      - name: Refresh touch-aware baselines
        run: python scripts/visual_regression.py --update
      - name: Commit generated baselines on same-repository pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/baselines/*.png
          if git diff --cached --quiet; then
            echo "Visual baselines already match the generated images."
            exit 0
          fi
          git commit -m "test: refresh touch-aware visual baselines"
          git push origin HEAD:${GITHUB_HEAD_REF}
      - name: Upload generated baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-touch
          path: tests/visual/baselines/*.png
          if-no-files-found: error
