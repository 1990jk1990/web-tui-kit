<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>web-tui-kit reference</title>
  <link rel="stylesheet" href="../src/tokens.css">
  <link rel="stylesheet" href="../src/tui.css">
  <script src="../src/tui.js" defer></script>
</head>
<body class="tui-desktop">
  <main class="tui-screen">
    <section class="tui-dialog" data-tui-escape-close aria-labelledby="package-title">
      <h1 class="tui-dialog-title" id="package-title">Package configuration</h1>

      <p class="tui-dialog-copy">Daemons using outdated libraries</p>
      <p class="tui-dialog-copy">Which services should be restarted?</p>

      <div class="tui-checklist" role="group" aria-label="Services to restart">
        <label class="tui-check-row">
          <input type="checkbox" checked autofocus>
          <span class="tui-mark" aria-hidden="true"></span>
          <span>accounts-daemon.service</span>
          <span class="tui-help">&lt;Help&gt;</span>
        </label>
        <label class="tui-check-row">
          <input type="checkbox">
          <span class="tui-mark" aria-hidden="true"></span>
          <span>apache2.service</span>
          <span class="tui-help">&lt;Help&gt;</span>
        </label>
        <label class="tui-check-row">
          <input type="checkbox" checked>
          <span class="tui-mark" aria-hidden="true"></span>
          <span>cron.service</span>
          <span class="tui-help">&lt;Help&gt;</span>
        </label>
        <label class="tui-check-row">
          <input type="checkbox">
          <span class="tui-mark" aria-hidden="true"></span>
          <span>dbus.service</span>
          <span class="tui-help">&lt;Help&gt;</span>
        </label>
        <label class="tui-check-row">
          <input type="checkbox" checked>
          <span class="tui-mark" aria-hidden="true"></span>
          <span>nginx.service</span>
          <span class="tui-help">&lt;Help&gt;</span>
        </label>
        <label class="tui-check-row">
          <input type="checkbox">
          <span class="tui-mark" aria-hidden="true"></span>
          <span>NetworkManager.service</span>
          <span class="tui-help">&lt;Help&gt;</span>
        </label>
        <label class="tui-check-row">
          <input type="checkbox" checked>
          <span class="tui-mark" aria-hidden="true"></span>
          <span>polkit.service</span>
          <span class="tui-help">&lt;Help&gt;</span>
        </label>
        <label class="tui-check-row">
          <input type="checkbox">
          <span class="tui-mark" aria-hidden="true"></span>
          <span>rsyslog.service</span>
          <span class="tui-help">&lt;Help&gt;</span>
        </label>
        <label class="tui-check-row">
          <input type="checkbox" checked>
          <span class="tui-mark" aria-hidden="true"></span>
          <span>ssh.service</span>
          <span class="tui-help">&lt;Help&gt;</span>
        </label>
        <label class="tui-check-row">
          <input type="checkbox">
          <span class="tui-mark" aria-hidden="true"></span>
          <span>systemd-logind.service</span>
          <span class="tui-help">&lt;Help&gt;</span>
        </label>
        <label class="tui-check-row">
          <input type="checkbox" checked>
          <span class="tui-mark" aria-hidden="true"></span>
          <span>systemd-resolved.service</span>
          <span class="tui-help">&lt;Help&gt;</span>
        </label>
        <label class="tui-check-row">
          <input type="checkbox">
          <span class="tui-mark" aria-hidden="true"></span>
          <span>udisks2.service</span>
          <span class="tui-help">&lt;Help&gt;</span>
        </label>
      </div>

      <div class="tui-actions">
        <button class="tui-button" type="button" accesskey="o"><span class="tui-hotkey">O</span>k</button>
      </div>
    </section>
  </main>
</body>
</html>
